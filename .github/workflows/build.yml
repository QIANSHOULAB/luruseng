name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:            # 只改网站或说明，不重新打包
      - 'index.html'
      - 'screenshot.png'
      - '.nojekyll'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt pytest pyinstaller
      - name: Tests (Windows)
        run: python -m pytest -q tests
      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name luruseng --icon assets/bangong.ico --add-data "assets/bangong.ico;assets" --collect-all pillow_heif main.py
      - name: Version file (the app checks this to know a new version is out)
        id: ver
        shell: pwsh
        run: |
          $v = python -c "from bangong import engine; print(engine.VERSION)"
          [IO.File]::WriteAllText("$PWD/dist/version.txt", $v.Trim())
          Copy-Item changes.md dist/changes.md
          "v=$($v.Trim())" >> $env:GITHUB_OUTPUT
          Write-Output "version $v"
      - name: Smoke test the exe against the mock server
        shell: pwsh
        run: |
          $mock = Start-Process python -ArgumentList 'tests/mock_server.py','8765' -PassThru -WindowStyle Hidden
          Start-Sleep 3
          $dir = Join-Path $env:RUNNER_TEMP '录入僧测试'
          New-Item -ItemType Directory -Force $dir | Out-Null
          python -c "from PIL import Image; [Image.new('RGB',(900,700),'white').save(r'$dir\p%d.jpg'%i) for i in range(7)]"
          $env:BANGONG_API = 'http://127.0.0.1:8765/v1beta'
          $env:BANGONG_KEY1 = 'AIzaSMOKE'
          $p = Start-Process dist/luruseng.exe -ArgumentList '--cli',$dir -Wait -PassThru
          Stop-Process $mock.Id
          Get-Content (Join-Path $dir '识别结果\录入僧日志.txt') -Encoding UTF8
          if ($p.ExitCode -ne 0) { throw "exe exit $($p.ExitCode)" }
          $x = Get-ChildItem (Join-Path $dir '识别结果') -Filter *.xlsx
          if ($x.Count -ne 1) { throw 'no xlsx' }
          $run = Get-ChildItem (Join-Path $dir '已识别') -Directory | Select-Object -First 1
          $stamped = Get-ChildItem $run.FullName -File
          $orig = Get-ChildItem (Join-Path $run.FullName '原图') -File
          $stamped | ForEach-Object { "stamped: $($_.Name) $($_.Length)" }
          $orig | ForEach-Object { "original: $($_.Name)" }
          if ($stamped.Count -ne 7 -or -not ($stamped | Where-Object { $_.Name -eq '01.jpg' })) { throw 'numbered photos missing' }
          if ($orig.Count -ne 7 -or -not ($orig | Where-Object { $_.Name -like '01_*' })) { throw 'originals missing' }
      - name: Category smoke test (自建类别：认全部内容)
        shell: pwsh
        run: |
          $mock = Start-Process python -ArgumentList 'tests/mock_server.py','8765' -PassThru -WindowStyle Hidden
          Start-Sleep 3
          New-Item -ItemType Directory -Force 'dist/类别/质检单' | Out-Null
          $dir = Join-Path $env:RUNNER_TEMP '类别测试'
          New-Item -ItemType Directory -Force $dir | Out-Null
          python -c "from PIL import Image; [Image.new('RGB',(900+i,700),'white').save(r'$dir\q%d.jpg'%i) for i in range(3)]"
          $env:BANGONG_API = 'http://127.0.0.1:8765/v1beta'
          $env:BANGONG_KEY1 = 'AIzaSMOKE'
          $env:BANGONG_CATEGORY = '质检单'
          $p = Start-Process dist/luruseng.exe -ArgumentList '--cli',$dir -Wait -PassThru
          Stop-Process $mock.Id
          Get-Content (Join-Path $dir '识别结果\录入僧日志.txt') -Encoding UTF8
          if ($p.ExitCode -ne 0) { throw "exe exit $($p.ExitCode)" }
          $x = Get-ChildItem (Join-Path $dir '识别结果') -Filter '*_质检单.xlsx'
          if ($x.Count -ne 1) { throw 'no 质检单 xlsx' }
          Remove-Item -Recurse -Force 'dist/类别'
      - name: Feed test (database)
        shell: pwsh
        run: |
          $book = Join-Path $env:RUNNER_TEMP 'TOOL BROKEN RECORD.xlsx'
          python -c "import sys; sys.path.insert(0, 'tests'); from test_kb import company_book; company_book(r'$book')"
          $p = Start-Process dist/luruseng.exe -ArgumentList '--feed',"`"$book`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "feed exit $($p.ExitCode)" }
          if (-not (Test-Path 'dist/数据库.sqlite')) { throw 'no database file' }
          python -c "import sqlite3; c = sqlite3.connect('dist/数据库.sqlite'); n = c.execute('select count(*) from records').fetchone()[0]; print('records', n); assert n == 8"
      - name: Update test (self-replace)
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP '更新测试'
          New-Item -ItemType Directory -Force $d | Out-Null
          $old = Join-Path $d '录入僧.exe'
          $new = Join-Path $d '录入僧.new.exe'
          Set-Content -Path $old -Value 'old build'
          Copy-Item dist/luruseng.exe $new
          $v = Join-Path $d 'v.txt'
          $p = Start-Process $new -ArgumentList '--write-version',$v -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "write-version exit $($p.ExitCode)" }
          Write-Output "version: $(Get-Content $v)"
          $env:BANGONG_NO_LAUNCH = '1'
          $p = Start-Process $new -ArgumentList '--install-update',$old -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install-update exit $($p.ExitCode)" }
          if ((Get-FileHash $old).Hash -ne (Get-FileHash $new).Hash) { throw 'old exe was not replaced' }
          Get-Content (Join-Path $d '更新日志.txt') -Encoding UTF8
      - name: Shortcut test
        shell: pwsh
        run: |
          $p = Start-Process dist/luruseng.exe -ArgumentList '--shortcuts' -Wait -PassThru
          Get-Content (Join-Path $env:APPDATA '录入僧\shortcut.log') -ErrorAction SilentlyContinue
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) '录入僧.lnk'
          if ($p.ExitCode -ne 0 -or -not (Test-Path $lnk)) { throw "no shortcut ($($p.ExitCode))" }
          $sh = New-Object -ComObject Shell.Application
          $item = $sh.NameSpace((Split-Path $lnk)).ParseName((Split-Path $lnk -Leaf))
          $target = $item.GetLink.Path
          Write-Output "target: $target"
          if (-not $target.EndsWith('luruseng.exe')) { throw "bad target $target" }
      - name: Auto-update test (fake website with a newer version)
        shell: pwsh
        run: |
          $site = Join-Path $env:RUNNER_TEMP '假网站'
          New-Item -ItemType Directory -Force $site | Out-Null
          Copy-Item dist/luruseng.exe (Join-Path $site 'luruseng.exe')
          [IO.File]::WriteAllText((Join-Path $site 'version.txt'), '99.0.0')
          $srv = Start-Process python -ArgumentList '-m','http.server','8766','--directory',$site -PassThru -WindowStyle Hidden
          Start-Sleep 3
          $d = Join-Path $env:RUNNER_TEMP '自动更新测试'
          New-Item -ItemType Directory -Force $d | Out-Null
          $env:BANGONG_UPDATE = 'http://127.0.0.1:8766'
          $p = Start-Process dist/luruseng.exe -ArgumentList '--check-update',$d -Wait -PassThru
          Stop-Process $srv.Id
          if ($p.ExitCode -ne 0) { throw "check-update exit $($p.ExitCode)" }
          $got = Join-Path $d '录入僧.new.exe'
          if (-not (Test-Path $got)) { throw 'no 录入僧.new.exe downloaded' }
          if ((Get-FileHash $got).Hash -ne (Get-FileHash dist/luruseng.exe).Hash) { throw 'downloaded exe differs' }
          if (Get-ChildItem $d -Filter *.part) { throw 'left a .part file' }
          Get-Content (Join-Path $d '更新日志.txt') -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: luruseng-exe
          path: dist/luruseng.exe
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 录入僧 v${{ steps.ver.outputs.v }}（build ${{ github.run_number }}）
          files: |
            dist/luruseng.exe
            dist/version.txt
            dist/changes.md
          make_latest: true
