<head>

<meta property="og:title" content="Get a free API key · Luru">

<script>
  /* 挑语言：?lang=zh|en（只管这一次）> 右上角选过的（localStorage luruseng.lang）> 默认英文。字全在 web/strings.js */
  (function () {
    var I = window.LURU_I18N; if (!I) return;
    document.documentElement.lang = I.htmlLang();
    if (I.lang() !== 'en') { document.documentElement.className += ' i18n-wait'; setTimeout(function () { document.documentElement.classList.remove('i18n-wait'); }, 1500); }
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%235AB4FF'/%3E%3Cstop offset='1' stop-color='%231E7BF2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Crect x='19' y='15' width='26' height='34' rx='4.5' fill='%23fff'/%3E%3Crect x='24' y='23' width='14' height='3' rx='1.5' fill='%232F8BF5'/%3E%3Crect x='24' y='30.5' width='14' height='3' rx='1.5' fill='%232F8BF5'/%3E%3Crect x='24' y='38' width='9' height='3' rx='1.5' fill='%232F8BF5'/%3E%3C/svg%3E">
<style>
  :root {
    --card: #FAFBFC;
    --line: #E3E6EB;
    --text: #1D1D1F;
    --grey: #6E6E73;
    --blue: #007AFF;
    --blue-down: #0062CC;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei",
            "Segoe UI Variable Text", "Segoe UI", "Noto Sans CJK SC", system-ui, sans-serif;
  }
  html[lang=en] {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui,
            "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  }
  html.i18n-wait body { visibility: hidden; }
  html[lang=en] h1 { letter-spacing: -.02em; }
  .num { font-variant-numeric: tabular-nums; }
  .lang { position: absolute; top: 16px; right: 20px; display: inline-flex; padding: 2px; border-radius: 10px;
          background: rgba(120, 120, 128, .12); z-index: 2; }
  .lang button { font: inherit; font-size: 13px; font-weight: 600; min-width: 44px; height: 30px; padding: 0 10px; border: 0;
                 border-radius: 8px; background: transparent; color: var(--grey); cursor: pointer; }
  .lang button[aria-pressed="true"] { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
  .lang button:focus-visible { outline: 3px solid rgba(0, 122, 255, .35); outline-offset: 1px; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    background: linear-gradient(180deg, #E4EEFB 0%, #EEF3FA 420px, #F5F7FA 100%);
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 0 20px; position: relative; }

  .back { display: inline-block; margin-top: 26px; color: var(--grey); font-size: 15px; }
  .hero { padding: 26px 0 8px; display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center; }
  .icon { width: 88px; height: 88px; display: block; filter: drop-shadow(0 10px 18px rgba(30, 123, 242, .28)); }
  h1 { font-size: 46px; line-height: 1.15; margin: 0; letter-spacing: .02em; }
  h1 span + span { display: inline-block; margin-left: .35em; color: var(--blue); }
  .tagline { margin-top: 10px; color: var(--grey); font-size: 18px; }
  .lead { font-size: 19px; margin: 26px 0 0; max-width: 700px; }
  .cta { margin-top: 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; }
  .dl {
    display: inline-flex; align-items: center; gap: 12px;
    background: var(--blue); color: #fff; font-weight: 600; font-size: 17px;
    padding: 15px 28px; border-radius: 12px;
    box-shadow: 0 10px 24px -6px rgba(0, 122, 255, .45);
    transition: background .15s, transform .15s;
  }
  .dl:hover { background: #0A84FF; text-decoration: none; transform: translateY(-1px); }
  .dl:active { background: var(--blue-down); transform: none; }
  .dl svg { width: 20px; height: 20px; }
  .meta { color: var(--grey); font-size: 14px; }

  section { padding: 56px 0 0; }
  h2 { font-size: 28px; margin: 0 0 22px; letter-spacing: .02em; }
  h2 small { font-size: 16px; color: var(--grey); font-weight: 400; margin-left: 10px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 22px 20px; }
  .num {
    width: 30px; height: 30px; border-radius: 50%; background: var(--blue); color: #fff;
    display: grid; place-items: center; font-weight: 700; font-size: 15px; margin-bottom: 14px;
  }
  .card h3 { margin: 0 0 6px; font-size: 18px; }
  .card p { margin: 0; color: #3A3A3C; font-size: 15px; }
  code {
    font-family: ui-monospace, "SF Mono", Consolas, "Microsoft YaHei UI", monospace; font-size: .92em;
    background: #EEF1F5; border-radius: 6px; padding: 1px 6px;
  }
  .btnlike {
    display: inline-block; border: 1px solid #C9CED6; background: #fff; border-radius: 6px;
    padding: 0 8px; font-size: 14px; line-height: 1.6; white-space: nowrap;
  }
  .facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .facts li {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 18px 14px 46px; position: relative; font-size: 15px; scroll-margin-top: 24px;
  }
  .facts li::before {
    content: ""; position: absolute; left: 18px; top: 20px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--blue); box-shadow: 0 0 0 4px #DCEBFF;
  }
  .facts li:target { border-color: var(--blue); box-shadow: 0 0 0 3px #DCEBFF; }
  .facts b { font-weight: 600; }
  .facts .hot { background: #FFF8EC; border-color: #F5DFA8; }
  .facts .hot::before { background: #FF9500; box-shadow: 0 0 0 4px #FFEBCC; }
  .facts .hot em { font-style: normal; font-weight: 700; color: #B42318; }
  footer { margin: 72px 0 0; padding: 24px 0 40px; border-top: 1px solid var(--line); color: var(--grey); font-size: 14px;
           display: flex; flex-wrap: wrap; gap: 8px 22px; justify-content: space-between; }
  footer a { color: var(--grey); }

  @media (max-width: 960px) { .grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
    .hero { grid-template-columns: 1fr; gap: 16px; }
    .icon { width: 64px; height: 64px; }
    h1 { font-size: 34px; }
    .lang { right: 16px; }
    .wrap { padding: 0 16px; }
    h1 span + span { margin-left: 0; display: block; }
    .tagline { font-size: 16px; }
    .lead { font-size: 17px; margin-top: 18px; }
    .dl { width: 100%; justify-content: center; }
    section { padding-top: 44px; }
    h2 { font-size: 24px; }
    h2 small { display: block; margin: 4px 0 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="lang" class="lang"></div>

  <a class="back" href="./" data-i18n="key.back">‹ Luru</a>

  <header class="hero">
    <svg class="icon" viewBox="0 0 64 64" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5AB4FF"/><stop offset="1" stop-color="#1E7BF2"/></linearGradient></defs>
      <rect width="64" height="64" rx="15" fill="url(#g)"/>
      <circle cx="23" cy="32" r="8.5" fill="none" stroke="#fff" stroke-width="5"/>
      <path d="M31.5 32H50M43 32v8M49 32v6" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <div>
      <h1><span data-i18n="key.h1">Get a free key</span><span data-i18n="key.h1tag">No catch</span></h1>
      <div class="tagline" data-i18n="key.tagline"></div>
    </div>
  </header>

  <p class="lead" data-i18n="key.lead"></p>

  <div class="cta">
    <a class="dl" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H21M18 12v3.5M21 12v2.5"/></svg>
      <span data-i18n="key.cta">Get it from Google</span>
    </a>
    <a class="meta" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>
  </div>

  <section>
    <h2 data-i18n="key.stepsH">Four steps, two minutes</h2>
    <div class="grid">
      <div class="card">
        <div class="num">1</div>
        <h3 data-i18n="key.s1h"></h3>
        <p data-i18n="key.s1p"></p>
      </div>
      <div class="card">
        <div class="num">2</div>
        <h3 data-i18n="key.s2h"></h3>
        <p data-i18n-html="key.s2p"></p>
      </div>
      <div class="card">
        <div class="num">3</div>
        <h3 data-i18n="key.s3h"></h3>
        <p data-i18n-html="key.s3p"></p>
      </div>
      <div class="card">
        <div class="num">4</div>
        <h3 data-i18n="key.s4h"></h3>
        <p data-i18n="key.s4p"></p>
      </div>
    </div>
  </section>

  <section>
    <h2><span data-i18n="key.rulesH">Three ground rules</span><small data-i18n="key.rulesSmall"></small></h2>
    <ul class="facts">
      <li class="hot" data-i18n-html="key.r1"></li>
      <li data-i18n-html="key.r2"></li>
      <li id="key2" data-i18n-html="key.r3"></li>
    </ul>
  </section>

  <footer>
    <span><span data-i18n="site.foot">Luru · Photo Typist</span><br><span data-i18n="site.contact"></span><a id="mail" href="#">oilsongchengmin@gmail.com</a></span>
    <span><a href="./" data-i18n="key.home">Home</a> ·
      <a href="https://github.com/QIANSHOULAB/luruseng/releases/latest/download/luruseng.exe" data-i18n="site.dl">Download for Windows</a></span>
  </footer>
</div>

<script>
  (function () {
    var I = window.LURU_I18N;
    var mail = document.getElementById('mail');
    var addr = ['oilsongchengmin', 'gmail.com'].join('@');       // 拼起来写，少招点垃圾邮件
    function render() {
      I.apply(document);
      document.title = I.t('key.title');
      document.querySelector('meta[name="description"]').content = I.t('key.desc');
      mail.href = 'mailto:' + addr + '?subject=' + encodeURIComponent(I.t('site.mailSubject'));
      mail.textContent = addr;
      document.documentElement.classList.remove('i18n-wait');
    }
    I.toggle(document.getElementById('lang'));
    I.onChange(render);
    render();
  })();
</script>
</body>
</html>
